# Roda a suite (SRP simulado + OCR com o Tesseract de vendor/) a cada push e pull request.
name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Dependencias
        run: python -m pip install pywinauto openpyxl pillow
      - name: Testes
        run: python -m unittest discover -s tests -v
