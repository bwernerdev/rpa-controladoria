# Roda a suite (SRP simulado + OCR com o Tesseract de vendor/) a cada push e pull request.
name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Dependencias
        # customtkinter e tkinterdnd2: os testes da janela (test_janela.py) pulam sem eles
        run: python -m pip install pywinauto openpyxl pillow tkinterdnd2 customtkinter==6.0.0 ruff==0.17.6
      - name: Checagem estatica (ruff.toml)
        run: python -m ruff check .
      - name: Testes
        run: python -m unittest discover -s tests -v
